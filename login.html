<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AprendIDos — Entrar na plataforma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --roxo: #6B4FBB;
    --roxo-escuro: #4A3291;
    --bege: #F5E6D3;
    --bege-hover: #EFD9BE;
    --texto: #2D2444;
    --texto-suave: #5C5470;
    --branco: #ffffff;
    --verde: #28A745;
    --verde-hover: #218838;
    --erro: #DC3545;
  }

  html, body {
    height: 100%;
    font-family: 'Nunito', sans-serif;
    color: var(--texto);
    overflow-x: hidden;
  }

  /* Fundo com imagem */
  .bg-layer {
    position: fixed;
    inset: 0;
    background-image: url('https://z-cdn-media.chatglm.cn/files/e229779a-37c4-4680-abad-f2e9bfff1768.png?auth_key=1886393100-a55ffd2034d24285b17592d3446d2735-0-2a8baa826b9758dfc72f034ebf558694');
    background-size: cover;
    background-position: center;
    z-index: -2;
  }

  /* Overlay escuro translúcido */
  .bg-overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, rgba(15, 15, 20, 0.58) 0%, rgba(30, 30, 35, 0.48) 100%);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: -1;
  }

  /* Container central */
  .container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    text-align: center;
  }

  /* Logo */
  .logo {
    width: 420px; 
    max-width: 85vw;
    height: auto;
    filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.5));
    animation: surgirLogo 1s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes surgirLogo {
    from { opacity: 0; transform: translateY(-20px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Slogan */
  .slogan {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 1.8rem;
    color: #ffffff;
    margin-top: 4px; 
    letter-spacing: 0.3px;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7);
    animation: surgir 1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
  }

  /* Wrapper dos botões */
  .botoes {
    display: flex;
    flex-direction: column;
    gap: 20px; 
    width: 100%;
    max-width: 440px; 
    margin-top: 44px;
    animation: surgir 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
  }

  @keyframes surgir {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    width: 100%;
    padding: 20px 24px;
    border-radius: 20px;
    font-family: 'Nunito', sans-serif;
    font-size: 1.25rem; 
    font-weight: 800;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    min-height: 68px; 
    text-decoration: none;
  }

  .btn:active { transform: scale(0.98); }
  .btn:focus-visible { outline: 4px solid #ffffff; outline-offset: 3px; }
  .btn svg, .btn i { width: 30px; height: 30px; font-size: 28px; flex-shrink: 0; }

  /* Botão Google */
  .btn-google {
    background: var(--branco);
    color: #3c4043;
    border-color: #dadce0;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  }
  .btn-google:hover {
    background: #fafafa;
    border-color: var(--roxo);
    transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.30);
  }

  /* Botão Facebook */
  .btn-facebook {
    background: #1877F2;
    color: #fff;
    box-shadow: 0 8px 24px rgba(24, 119, 242, 0.45);
  }
  .btn-facebook:hover {
    background: #166FE5;
    transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(24, 119, 242, 0.55);
  }

  /* Botão E-mail */
  .btn-email {
    background: var(--bege);
    color: var(--roxo-escuro);
    border-color: #E8D5BD;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.20);
  }
  .btn-email:hover {
    background: var(--bege-hover);
    transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
  }

  /* Caixa Criar Conta */
  .area-cadastro {
    margin-top: 14px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(8px);
    border: 1.5px solid rgba(255, 255, 255, 0.3);
    border-radius: 18px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    color: #ffffff;
  }

  .area-cadastro p {
    font-size: 1.1rem;
    font-weight: 600;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  .btn-criar-conta {
    background: #FFD54F;
    color: #3E2723;
    text-decoration: none;
    font-weight: 800;
    font-size: 1.15rem;
    padding: 12px 20px;
    border-radius: 14px;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-criar-conta:hover {
    background: #FFCA28;
    transform: scale(1.02);
  }

  /* ==========================================================
     MODAL DE LOGIN COM E-MAIL
     ========================================================== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(5px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .modal-overlay.open {
    display: flex;
    opacity: 1;
  }

  .modal-content {
    background: #ffffff;
    width: 100%;
    max-width: 460px;
    border-radius: 26px;
    padding: 32px 28px;
    box-shadow: 0 20px 45px rgba(0,0,0,0.4);
    position: relative;
    text-align: left;
    animation: zoomModal 0.3s ease;
  }

  @keyframes zoomModal {
    from { transform: scale(0.92); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal-close {
    position: absolute;
    top: 18px;
    right: 18px;
    background: #F3F3F3;
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.2rem;
    color: var(--texto-suave);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .modal-close:hover { background: #E0E0E0; color: var(--texto); }

  .modal-titulo {
    font-family: 'Fredoka', sans-serif;
    font-size: 1.75rem;
    color: var(--roxo-escuro);
    margin-bottom: 6px;
  }

  .modal-subtitulo {
    font-size: 1.05rem;
    color: var(--texto-suave);
    margin-bottom: 22px;
    font-weight: 600;
  }

  .campo-grupo {
    margin-bottom: 16px;
  }

  .campo-label {
    display: block;
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--texto);
    margin-bottom: 6px;
  }

  .campo-input {
    width: 100%;
    padding: 14px 18px;
    border: 2px solid #E8D6B8;
    background: #FDFBF7;
    border-radius: 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    outline: none;
    transition: border-color 0.2s;
  }
  .campo-input:focus {
    border-color: var(--roxo);
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(107,79,187,0.15);
  }

  .btn-entrar-email {
    width: 100%;
    padding: 16px;
    background: var(--roxo);
    color: #ffffff;
    border: none;
    border-radius: 16px;
    font-family: 'Nunito', sans-serif;
    font-size: 1.25rem;
    font-weight: 800;
    cursor: pointer;
    margin-top: 12px;
    transition: all 0.2s ease;
  }
  .btn-entrar-email:hover {
    background: var(--roxo-escuro);
  }

  .feedback-erro-login {
    display: none;
    background: #FFEBEB;
    color: var(--erro);
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 700;
    margin-top: 12px;
  }

  /* Responsivo */
  @media (max-width: 600px) {
    .logo { width: 300px; }
    .slogan { font-size: 1.5rem; margin-top: 4px; }
    .botoes { margin-top: 32px; gap: 16px; max-width: 100%; }
    .btn { font-size: 1.15rem; padding: 16px 18px; min-height: 64px; }
    .btn svg, .btn i { width: 26px; height: 26px; font-size: 24px; }
  }
</style>
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>
  <div class="bg-overlay" aria-hidden="true"></div>

  <main class="container">
    <a href="inicio.html" title="Página inicial">
      <img
        src="https://z-cdn-media.chatglm.cn/files/dccd2866-4c25-4482-b7a7-4d0d1e15d377.png?auth_key=1886391764-18bb28b2f3374b2ea7866cd244c35326-0-f2332627d4ee3b90bf75b318175d04c5"
        alt="Logo AprendIDos com coruja e idosos"
        class="logo"
      >
    </a>

    <h1 class="slogan">
      Aprender hoje, transformar sempre.
    </h1>

    <div class="botoes" role="group" aria-label="Opções de login">
      <!-- Botão Google -->
      <button class="btn btn-google" id="btnGoogleLogin" type="button" aria-label="Entrar com Google">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span>Entrar com Google</span>
      </button>

      <!-- Botão Facebook -->
      <button class="btn btn-facebook" id="btnFacebookLogin" type="button" aria-label="Entrar com Facebook">
        <i class="fa-brands fa-facebook" aria-hidden="true"></i>
        <span>Entrar com Facebook</span>
      </button>

      <!-- Botão E-mail -->
      <button class="btn btn-email" id="btnAbrirModalEmail" type="button" aria-label="Entrar com e-mail">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="4" width="20" height="16" rx="3"/>
          <path d="M3 6.5l9 6 9-6"/>
        </svg>
        <span>Entrar com e-mail</span>
      </button>

      <!-- Área de Cadastro -->
      <div class="area-cadastro">
        <p>Novo por aqui?</p>
        <a href="cadastro.html" class="btn-criar-conta">
          <i class="fa-solid fa-user-plus"></i> Criar uma conta grátis
        </a>
      </div>
    </div>
  </main>

  <!-- Modal Login com E-mail -->
  <div class="modal-overlay" id="modalEmail" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
    <div class="modal-content">
      <button class="modal-close" id="btnFecharModal" aria-label="Fechar janela">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <h2 class="modal-titulo" id="modalTitulo">Entrar com e-mail</h2>
      <p class="modal-subtitulo">Informe seu e-mail e senha para continuar:</p>

      <form id="formLoginEmail">
        <div class="campo-grupo">
          <label class="campo-label" for="loginEmail">Seu E-mail:</label>
          <input type="email" id="loginEmail" class="campo-input" placeholder="exemplo@email.com" required>
        </div>

        <div class="campo-grupo">
          <label class="campo-label" for="loginSenha">Sua Senha:</label>
          <input type="password" id="loginSenha" class="campo-input" placeholder="Digite sua senha" required>
        </div>

        <div id="erroLoginEmail" class="feedback-erro-login" role="alert"></div>

        <button type="submit" class="btn-entrar-email" id="btnConfirmarEmail">
          <i class="fa-solid fa-right-to-bracket"></i> Entrar
        </button>
      </form>
    </div>
  </div>

  <!-- Integração JavaScript (Compatível com duplo-clique local e servidores) -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const btnGoogle = document.getElementById('btnGoogleLogin');
      const btnFacebook = document.getElementById('btnFacebookLogin');
      const modal = document.getElementById('modalEmail');
      const btnAbrir = document.getElementById('btnAbrirModalEmail');
      const btnFechar = document.getElementById('btnFecharModal');
      const formLogin = document.getElementById('formLoginEmail');
      const erroEl = document.getElementById('erroLoginEmail');

      // 1. Login com Google
      if (btnGoogle) {
        btnGoogle.addEventListener('click', function() {
          btnGoogle.style.opacity = '0.7';
          btnGoogle.disabled = true;

          const usuarioGoogle = {
            id: 'google_' + Date.now(),
            nome: 'Manoel da Silva',
            name: 'Manoel da Silva',
            email: 'manoel.silva@gmail.com',
            avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&auto=format&fit=crop&q=80',
            provedor: 'google'
          };

          try {
            localStorage.setItem('aprendidos_usuario', JSON.stringify(usuarioGoogle));
          } catch(e) {}

          setTimeout(function() {
            window.location.href = 'index.html';
          }, 800);
        });
      }

      // 2. Login com Facebook
      if (btnFacebook) {
        btnFacebook.addEventListener('click', function() {
          btnFacebook.style.opacity = '0.7';
          btnFacebook.disabled = true;

          const usuarioFacebook = {
            id: 'facebook_' + Date.now(),
            nome: 'Maria Oliveira',
            name: 'Maria Oliveira',
            email: 'maria.oliveira@facebook.com',
            avatar: 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=150&auto=format&fit=crop&q=80',
            provedor: 'facebook'
          };

          try {
            localStorage.setItem('aprendidos_usuario', JSON.stringify(usuarioFacebook));
          } catch(e) {}

          setTimeout(function() {
            window.location.href = 'index.html';
          }, 800);
        });
      }

      // 3. Controle do Modal de E-mail
      if (btnAbrir && modal) {
        btnAbrir.addEventListener('click', function() {
          modal.classList.add('open');
          const input = document.getElementById('loginEmail');
          if (input) input.focus();
        });
      }

      if (btnFechar && modal) {
        btnFechar.addEventListener('click', function() {
          modal.classList.remove('open');
          if (erroEl) erroEl.style.display = 'none';
        });
      }

      if (modal) {
        modal.addEventListener('click', function(e) {
          if (e.target === modal) {
            modal.classList.remove('open');
            if (erroEl) erroEl.style.display = 'none';
          }
        });
      }

      if (formLogin) {
        formLogin.addEventListener('submit', function(e) {
          e.preventDefault();
          const emailInput = document.getElementById('loginEmail');
          const senhaInput = document.getElementById('loginSenha');
          const email = emailInput ? emailInput.value.trim() : '';
          const senha = senhaInput ? senhaInput.value : '';

          if (!email || !senha) {
            if (erroEl) {
              erroEl.textContent = 'Por favor, preencha o e-mail e a senha.';
              erroEl.style.display = 'block';
            }
            return;
          }

          const btn = document.getElementById('btnConfirmarEmail');
          if (btn) {
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Entrando...';
          }

          const nomeFormatado = email.split('@')[0].charAt(0).toUpperCase() + email.split('@')[0].slice(1);
          const usuarioEmail = {
            id: 'user_' + Date.now(),
            nome: nomeFormatado,
            name: nomeFormatado,
            email: email,
            avatar: null,
            provedor: 'email'
          };

          try {
            localStorage.setItem('aprendidos_usuario', JSON.stringify(usuarioEmail));
          } catch(e) {}

          setTimeout(function() {
            window.location.href = 'index.html';
          }, 800);
        });
      }
    });
  </script>

  <!-- Componente VLibras (Acessibilidade em LIBRAS) -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>

</body>
</html>
